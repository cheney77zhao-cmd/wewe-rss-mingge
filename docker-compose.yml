# New installs only. Existing deployment: docs/DEPLOY.md.
services:
  wewe-platform-local:
    build: ./relay
    restart: unless-stopped
    environment:
      PLATFORM_SECRET: ${PLATFORM_SECRET:?Run init_env.py first}
      PLATFORM_DB: /data/platform.db
      PORT: "8090"
      MIN_REQUEST_INTERVAL: "3"
      RISK_BLOCK_SECONDS: "21600"
      LOG_LEVEL: INFO
    volumes:
      - ./data/platform:/data
    expose:
      - "8090"
  wewe-rss:
    build:
      context: ./app
      target: app-sqlite
    restart: unless-stopped
    depends_on:
      wewe-platform-local:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEWE_PORT:-8088}:4000"
    environment:
      DATABASE_TYPE: sqlite
      AUTH_CODE: ${AUTH_CODE:?Run init_env.py first}
      PLATFORM_URL: http://wewe-platform-local:8090
      MAX_REQUEST_PER_MINUTE: "60"
      CRON_EXPRESSION: ${CRON_EXPRESSION:-0 2 * * *}
      UPDATE_DELAY_TIME: 60s
      SERVER_ORIGIN_URL: ${SERVER_ORIGIN_URL:-http://localhost:8088}
      TZ: Asia/Shanghai
    volumes:
      - ./data/wewe:/app/data
